# Gera o IevcLivestreamHelper.exe e publica em "Releases" no GitHub.
#
# - Push na main  → compila e cria uma Release nova (v1.0.<número da execução>)
# - Pull request  → só compila, para conferir que está tudo certo
# - Manual        → aba "Actions" → "Publicar .exe" → "Run workflow"

name: Publicar .exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # necessário para criar a Release

jobs:
  publicar:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar o .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Definir a versão
        id: versao
        shell: bash
        run: echo "numero=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Gerar o .exe
        run: >
          dotnet publish src/IevcLivestreamHelper
          --configuration Release
          --output publish
          -p:Version=${{ steps.versao.outputs.numero }}

      - name: Guardar o .exe nesta execução
        uses: actions/upload-artifact@v4
        with:
          name: IevcLivestreamHelper-${{ steps.versao.outputs.numero }}
          path: publish/IevcLivestreamHelper.exe

      - name: Publicar a Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versao.outputs.numero }}
          name: IEVC Livestream Helper v${{ steps.versao.outputs.numero }}
          target_commitish: ${{ github.sha }}
          files: publish/IevcLivestreamHelper.exe
          generate_release_notes: true
          make_latest: true
